# 批量渲染配置文件
_BASE_: render_config.yaml

# 基础渲染设置
Resolution: [1024, 1024]
Output_Path: "/home_ssd/sjy/UE5_Project/PCGBiomeForestPoplar/Saved/MovieRenders/train_data"
File_Name_Format: "{sequence_name}/{render_pass}/{frame_number}"
Motion_Blur: false

# 仅补 OCC 深度单帧（用于快速恢复缺失数据）
Only_OCC: true
Single_Frame_Only: true
Single_Frame_Index: 16

Anti_Alias:
    enable: true
    spatial_samples: 8
    temporal_samples: 1

# 渲染通道设置
Render_Passes:
    -
        pass_name: 'rgb'
        enable: false
        ext: "png"
    -
        pass_name: 'depth'
        enable: true
        ext: "exr"
    -
        pass_name: 'normal'
        enable: false
        ext: "exr"
    -
        pass_name: 'diffuse'
        enable: false
        ext: "png"
    -
        pass_name: 'metallic'
        enable: false
        ext: "png"
    -
        pass_name: 'roughness'
        enable: false
        ext: "png"
    -
        pass_name: 'specular'
        enable: false
        ext: "png"
    -
        pass_name: 'basecolor'
        enable: false
        ext: "png"

# 批量处理设置
Batch_Settings:
  # 地图文件夹路径
  maps_folder: "/Game/Map"
  
  # 目标物前缀
  target_prefix: "Target_"
  
  # 遮挡物前缀
  occlusion_prefix: "SM_"
  
  # 相机名称
  camera_name: "CineCameraActor1"
  
  # 序列设置
  sequence_fps: 24
  sequence_folder: "/Game/Sequences"

# 输出设置
Output_Settings:
  # 文件命名格式
  # 支持的变量: {map_name}, {target_name}, {suffix}, {render_pass}, {frame_number}
  file_name_format: "{map_name}_{target_name}_{suffix}/{render_pass}/{frame_number}"
  
  # 后缀设置
  occlusion_suffix: "occ"    # 有遮挡物的后缀
  ground_truth_suffix: "GT"  # 无遮挡物的后缀