_BASE_: render_config.yaml
Resolution:
- 512
- 512
Output_Path: Saved/MovieRenders/forest_dataset
File_Name_Format: '{sequence_name}/{render_pass}/{frame_number}'
Motion_Blur: false
Console_Variables:
  r.AllowOcclusionQueries: 1
  r.HZBOcclusion: 0
  r.NeverOcclusionTestDistance: 1000000
  r.Test.OverrideTimeMaterialExpressions: 0
Only_OCC: false
Single_Frame_Only: false
Single_Frame_Index: 12
Anti_Alias:
  enable: true
  spatial_samples: 8
  temporal_samples: 1
Render_Passes:
- pass_name: rgb
  enable: true
  ext: png
- pass_name: depth
  enable: true
  ext: exr
- pass_name: normal
  enable: false
  ext: exr
- pass_name: diffuse
  enable: false
  ext: png
- pass_name: metallic
  enable: false
  ext: png
- pass_name: roughness
  enable: false
  ext: png
- pass_name: specular
  enable: false
  ext: png
- pass_name: basecolor
  enable: false
  ext: png
Batch_Settings:
  maps_folder: /Game/Map/dataset
  target_prefix: Target_
  occlusion_prefix: SM_
  camera_name: CineCameraActor1
  sequence_fps: 24
  sequence_folder: /Game/Sequences
Output_Settings:
  file_name_format: '{map_name}_{target_name}_{suffix}/{render_pass}/{frame_number}'
  occlusion_suffix: occ
  ground_truth_suffix: GT
  base_output_path: Saved/MovieRenders/forest_dataset
