# 轨迹配置文件
# 支持的轨迹类型: 'fix_line', 'rot_line'

# 轨迹类型选择
trajectory_type: 'rot_line'  # 可选: 'fix_line', 'rot_line'

# fix_line 轨迹参数
fix_line:
  num_frames: 32              # 图像张数（帧数）
  angle_degrees: 0.0           # 与x轴的夹角（度）, 0度表示沿x轴正方向
  height_offset: 10000.0        # 相对于目标物的高度偏移（UE单位：cm，1500cm = 15米）
  trajectory_length: 5000.0    # 运动轨迹的长度（UE单位：cm，5000cm = 50米）

# rot_line 轨迹参数（圆弧轨迹）
rot_line:
  num_frames: 33              # 图像张数（帧数）
  arc_angle_degrees: 90.0     # 圆弧的角度范围（度），90度表示1/4圆弧
  radius: 5000.0              # 圆弧半径（UE单位：cm，5000cm = 50米）
  plane_angle_degrees: 45.0    # 垂直平面与X轴的夹角（度）


# 序列设置
sequence:
  fps: 24                     # 序列帧率
  sequence_dir: '/Game/Sequences'  # 序列保存目录

# 相机设置
camera:
  name: 'CineCameraActor1'    # 场景中相机的名称

# 示例配置说明:

# fix_line轨迹（直线轨迹）:
# 1. 在目标物正上方生成一条直线轨迹，相机垂直向下看
# 2. angle_degrees: 0度表示沿x轴，90度表示沿y轴，45度表示东北方向
# 3. height_offset: 相机相对于目标物的高度，正值表示在目标物上方
# 4. trajectory_length: 轨迹总长度，相机会在这条线上从一端移动到另一端
# 5. num_frames: 生成的帧数，决定了轨迹的采样密度

# rot_line轨迹（圆弧轨迹）:
# 1. 以目标物为中心生成圆弧轨迹，相机始终对准目标物
# 2. 圆弧轨迹在包含目标物Z轴的垂直平面内
# 3. arc_angle_degrees: 圆弧的角度范围，90度表示1/4圆，180度表示半圆
# 4. radius: 相机到目标物的距离（圆弧半径）
# 5. plane_angle_degrees: 垂直平面与X轴的夹角
#    - 0度: 圆弧在XZ平面内
#    - 90度: 圆弧在YZ平面内
#    - 45度: 圆弧在倾斜45度的垂直平面内
# 6. num_frames: 生成的帧数，决定了圆弧的采样密度

# 常用角度参考:
# 0度   - 沿x轴正方向（东）
# 90度  - 沿y轴正方向（北）
# 180度 - 沿x轴负方向（西）
# 270度 - 沿y轴负方向（南）
# 45度  - 东北方向
# 135度 - 西北方向